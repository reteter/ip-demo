name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS app
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Show native toolchain versions
        run: |
          xcodebuild -version
          pod --version

      - name: Type-check application
        run: npm run typecheck

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Locate generated Xcode project
        id: ios-project
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [[ -z "$workspace" ]]; then
            echo "No Xcode workspace generated by Expo Prebuild." >&2
            exit 1
          fi

          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$(basename "$workspace" .xcworkspace)" >> "$GITHUB_OUTPUT"

      - name: Build unsigned app for a physical iPhone
        run: |
          xcodebuild \
            -workspace '${{ steps.ios-project.outputs.workspace }}' \
            -scheme '${{ steps.ios-project.outputs.scheme }}' \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "No .app bundle found after xcodebuild." >&2
            exit 1
          fi

          mkdir -p ios/build/ipa/Payload
          ditto "$app_path" ios/build/ipa/Payload/CounterDemo.app
          (
            cd ios/build/ipa
            /usr/bin/zip -qry ../CounterDemo-unsigned.ipa Payload
          )

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: counter-demo-ios-unsigned
          path: ios/build/CounterDemo-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
